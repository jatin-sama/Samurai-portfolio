name: Unpack project

on:
  push:
    branches: [main]
    paths: ['jamtin-project-fixed.zip']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and replace project files
        run: |
          set -e
          test -f jamtin-project.zip || { echo "jamtin-project.zip not found"; exit 1; }
          rm -rf /tmp/unpacked && mkdir /tmp/unpacked
          unzip -q jamtin-project.zip -d /tmp/unpacked
          DIR=$(find /tmp/unpacked -maxdepth 2 -name package.json -printf '%h\n' | head -n 1)
          test -n "$DIR" || { echo "package.json not found in zip"; exit 1; }
          rm -rf src scripts tests
          rsync -a "$DIR"/ ./
          rm -f jamtin-project.zip

      - name: Commit and push
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Unpack JAMTIN project"
          git push
