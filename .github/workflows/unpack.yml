name: Unpack project
on:
  push:
    paths: ['jamtin-project.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q jamtin-project.zip
          rsync -a jamtin-project/ ./
          rm -rf jamtin-project jamtin-project.zip
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack JAMTIN project" || exit 0
          git push
